<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHANTOM_CORE // SEC-OPS</title>
    <style>
        :root {
            --glow: #00f2ff; /* Cyan-hacker blue */
            --bg: #05080a;
            --scanline: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(var(--scanline) 50%, transparent 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .terminal-window {
            width: 80%;
            height: 70%;
            background: rgba(0, 20, 20, 0.8);
            border: 1px solid var(--glow);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            padding: 20px;
            position: relative;
        }

        h1 { font-size: 1.2rem; margin: 0 0 10px 0; border-bottom: 1px solid var(--glow); }

        #output { height: 85%; overflow-y: auto; margin-bottom: 10px; }

        input {
            width: 90%;
            background: transparent;
            border: none;
            color: var(--glow);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }

        .alert-pulse {
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        
        .cursor { display: inline-block; width: 10px; height: 18px; background: var(--glow); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="terminal-window">
    <h1>[//] PHANTOM_CORE_OPERATIONAL_SANDBOX</h1>
    <div id="output"></div>
    <div style="display:flex">
        <span>&gt;&nbsp;</span>
        <input type="text" id="input" autofocus>
        <span class="cursor"></span>
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const input = document.getElementById('input');

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.trim();
            output.innerHTML += `<div>> ${val}</div>`;
            
            if(val === 'alert') {
                output.innerHTML += `<div class="alert-pulse">> [!] CRITICAL SECURITY BREACH: UNAUTHORIZED PACKET INJECTION DETECTED</div>`;
            } else {
                output.innerHTML += `<div>> Processing Request... [SUCCESS]</div>`;
            }
            
            input.value = '';
            output.scrollTop = output.scrollHeight;
        }
    });
</script>
</body>
</html>
