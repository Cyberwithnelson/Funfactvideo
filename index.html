<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turbo Drift Racer</title>
    <style>
        body { margin: 0; background: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: 'Segoe UI', sans-serif; }
        #gameContainer { position: relative; }
        canvas { border: 4px solid #444; border-radius: 8px; background: #222; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); cursor: pointer; }
        .hidden { display: none !important; }
        h1 { margin: 0; color: #ff0055; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <h1 id="title">Turbo Drift</h1>
        <p>Click to Start / Use Arrows to Steer</p>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    
    let gameRunning = false;
    let score = 0;
    let speed = 5;
    let frame = 0;
    
    const player = { x: 180, y: 500, w: 40, h: 70 };
    let obstacles = [];

    window.addEventListener('keydown', (e) => {
        if (!gameRunning) return;
        if (e.key === 'ArrowLeft' && player.x > 20) player.x -= 30;
        if (e.key === 'ArrowRight' && player.x < canvas.width - 60) player.x += 30;
    });

    ui.addEventListener('click', () => {
        if (!gameRunning) startGame();
    });

    function startGame() {
        score = 0;
        speed = 5;
        obstacles = [];
        gameRunning = true;
        ui.classList.add('hidden');
        requestAnimationFrame(update);
    }

    function update() {
        if (!gameRunning) return;

        frame++;
        score += 0.1;
        if (frame % 500 === 0) speed += 0.5; // Gradually increase difficulty

        // Spawn obstacles
        if (frame % 40 === 0) {
            obstacles.push({ x: Math.random() * (canvas.width - 50), y: -100, w: 40, h: 70 });
        }

        // Move obstacles
        obstacles.forEach((o, i) => {
            o.y += speed;
            if (o.y > canvas.height) obstacles.splice(i, 1);
            
            // Collision
            if (player.x < o.x + o.w && player.x + player.w > o.x &&
                player.y < o.y + o.h && player.y + player.h > o.y) {
                gameOver();
            }
        });

        draw();
        requestAnimationFrame(update);
    }

    function gameOver() {
        gameRunning = false;
        ui.classList.remove('hidden');
        document.getElementById('title').innerText = "Crashed! Score: " + Math.floor(score);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Road
        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#555";
        for(let i=0; i<400; i+=40) { ctx.strokeRect(i, 0, 40, 600); }

        // Draw Player (Fancy)
        ctx.fillStyle = "#ff0055";
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.w, player.h, 5);
        ctx.fill();

        // Draw Obstacles (Fancy)
        ctx.fillStyle = "#00d4ff";
        obstacles.forEach(o => {
            ctx.beginPath();
            ctx.roundRect(o.x, o.y, o.w, o.h, 5);
            ctx.fill();
        });

        // UI Score
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Score: " + Math.floor(score), 10, 30);
    }
</script>
</body>
</html>
