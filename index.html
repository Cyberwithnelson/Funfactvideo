<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSecurity Sandbox v1.0</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bg-black: #0d0d0d;
        }
        body {
            background-color: var(--bg-black);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 800px;
            border: 1px solid var(--neon-green);
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }
        h1 { text-transform: uppercase; border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; }
        .terminal-output { height: 300px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #333; padding: 10px; }
        .input-area { display: flex; gap: 10px; }
        input { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); flex-grow: 1; padding: 5px; }
        button { background: var(--neon-green); color: black; border: none; cursor: pointer; font-weight: bold; padding: 5px 15px; }
        button:hover { background: #00cc33; }
        .alert { color: #ff3333; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>[ CYBER-SEC SANDBOX ]</h1>
    <div id="terminal" class="terminal-output">
        <p>> System Initialized...</p>
        <p>> Awaiting Command. Type 'scan' or 'verify'.</p>
    </div>
    
    <div class="input-area">
        <input type="text" id="cmd" placeholder="Enter command..." autofocus>
        <button onclick="processCommand()">EXECUTE</button>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminal');
    const cmdInput = document.getElementById('cmd');

    function processCommand() {
        const cmd = cmdInput.value.toLowerCase();
        const line = document.createElement('p');
        line.innerHTML = `> ${cmd}`;
        terminal.appendChild(line);

        if (cmd === 'scan') {
            const res = document.createElement('p');
            res.innerHTML = ">> Scanning network... Vulnerability found in PORT 8080 (SQL Injection).";
            terminal.appendChild(res);
        } else if (cmd === 'verify') {
            const alert = document.createElement('p');
            alert.className = 'alert';
            alert.innerHTML = "!! SECURITY ALERT: UNAUTHORIZED ACCESS DETECTED IN LOGS !!";
            terminal.appendChild(alert);
        } else {
            terminal.innerHTML += "<p>> Unknown Command.</p>";
        }
        cmdInput.value = '';
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>
</body>
</html>
