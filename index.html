<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open World Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    const worldSize = 2000; // Large world
    const player = { x: 100, y: 100, size: 30, speed: 5 };
    const camera = { x: 0, y: 0 };

    // Simple Input Handling
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    function update() {
        // Move Player
        if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

        // Keep player in bounds
        player.x = Math.max(0, Math.min(worldSize - player.size, player.x));
        player.y = Math.max(0, Math.min(worldSize - player.size, player.y));

        // Update Camera to follow player
        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
    }

    function draw() {
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw World (Represented as a grid)
        ctx.strokeStyle = '#555';
        for (let i = 0; i <= worldSize; i += 100) {
            ctx.beginPath();
            ctx.moveTo(i - camera.x, 0 - camera.y);
            ctx.lineTo(i - camera.x, worldSize - camera.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0 - camera.x, i - camera.y);
            ctx.lineTo(worldSize - camera.x, i - camera.y);
            ctx.stroke();
        }

        // Draw Player
        ctx.fillStyle = '#00FF00';
        ctx.fillRect(player.x - camera.x, player.y - camera.y, player.size, player.size);

        requestAnimationFrame(() => { update(); draw(); });
    }

    draw();
</script>
</body>
</html>
