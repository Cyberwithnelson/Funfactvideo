<!DOCTYPE html>
<html>
<head>
    <title>Web Theft Auto</title>
    <style>
        body { margin: 0; background: #2c3e50; color: white; font-family: sans-serif; }
        canvas { display: block; background: #34495e; }
        #ui { position: absolute; top: 10px; left: 10px; }
    </style>
</head>
<body>
    <div id="ui">Controls: WASD to Move | Space to Enter/Exit Vehicle</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = { x: 100, y: 100, inVehicle: false, speed: 4 };
    let car = { x: 300, y: 300, active: false, speed: 8 };
    let keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
        // Toggle Vehicle
        if (keys['Space']) {
            if (!player.inVehicle && Math.hypot(player.x - car.x, player.y - car.y) < 50) player.inVehicle = true;
            else player.inVehicle = false;
        }

        let mover = player.inVehicle ? car : player;
        let currentSpeed = player.inVehicle ? car.speed : player.speed;

        if (keys['KeyW']) mover.y -= currentSpeed;
        if (keys['KeyS']) mover.y += currentSpeed;
        if (keys['KeyA']) mover.x -= currentSpeed;
        if (keys['KeyD']) mover.x += currentSpeed;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Car
        ctx.fillStyle = player.inVehicle ? '#e74c3c' : '#bdc3c7';
        ctx.fillRect(car.x, car.y, 60, 30);

        // Draw Player
        if (!player.inVehicle) {
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
