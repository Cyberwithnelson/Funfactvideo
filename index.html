<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>斷食記錄器</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
        #recordList { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
        .record-item { background: #f9f9f9; padding: 10px; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>斷食記錄</h2>
    <div class="input-group">
        <label>開始體重 (kg)</label>
        <input type="number" id="startWeight" step="0.1">
    </div>
    <div class="input-group">
        <label>結束體重 (kg)</label>
        <input type="number" id="endWeight" step="0.1">
    </div>
    <div class="input-group">
        <label>斷食時長 (小時)</label>
        <select id="hours">
            <option value="16">16 小時</option>
            <option value="24">24 小時</option>
            <option value="36">36 小時</option>
            <option value="48">48 小時</option>
            <option value="60">60 小時</option>
            <option value="72">72 小時</option>
        </select>
    </div>
    <button onclick="saveRecord()">儲存記錄</button>

    <h3>歷史記錄</h3>
    <div id="recordList"></div>

    <script>
        function saveRecord() {
            const record = {
                start: document.getElementById('startWeight').value,
                end: document.getElementById('endWeight').value,
                hours: document.getElementById('hours').value,
                date: new Date().toLocaleDateString()
            };

            let records = JSON.parse(localStorage.getItem('fastingRecords') || '[]');
            records.push(record);
            localStorage.setItem('fastingRecords', JSON.stringify(records));
            loadRecords();
        }

        function loadRecords() {
            const list = document.getElementById('recordList');
            const records = JSON.parse(localStorage.getItem('fastingRecords') || '[]');
            list.innerHTML = records.map(r => `
                <div class="record-item">
                    <strong>${r.date}</strong>: ${r.hours}小時斷食<br>
                    體重: ${r.start}kg → ${r.end}kg (變化: ${(r.end - r.start).toFixed(1)}kg)
                </div>
            `).join('');
        }

        loadRecords();
    </script>
</body>
</html>
