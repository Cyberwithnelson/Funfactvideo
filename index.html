<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; }
        .page { display: none; padding: 40px; text-align: center; height: 80vh; }
        .active { display: block; }
        #loading-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .terminal { background: #000; border: 1px solid var(--neon); width: 80%; height: 200px; padding: 20px; overflow-y: auto; text-align: left; }
        button { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px 20px; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>

<!-- 1. LOADING PAGE -->
<div id="load" class="page active">
    <h1>INITIALIZING SYSTEM...</h1>
    <progress id="prog" value="0" max="100"></progress>
</div>

<!-- 2. MAIN DASHBOARD -->
<div id="main" class="page">
    <h1>CYBER_CORE // COMMAND</h1>
    <button onclick="show('intro')">INTRO</button>
    <button onclick="show('attack')">SIMULATE ATTACK</button>
    <button onclick="show('about')">ABOUT US</button>
</div>

<!-- 3. INTRO PAGE -->
<div id="intro" class="page">
    <h2>CYBERSECURITY ESSENTIALS</h2>
    <p>Understanding the digital landscape is vital for every student and educator.</p>
    <button onclick="show('main')">BACK</button>
</div>

<!-- 4. ATTACK SIMULATION -->
<div id="attack" class="page">
    <h2>THREAT_SIMULATOR</h2>
    <div id="term" class="terminal">> Waiting for input...</div>
    <button onclick="runAttack()">EXECUTE SCAN</button>
    <button onclick="show('main')">BACK</button>
</div>

<!-- 5. ABOUT US -->
<div id="about" class="page">
    <h2>ABOUT_PROJECT</h2>
    <p>A mission to secure the classroom of tomorrow.</p>
    <button onclick="show('main')">BACK</button>
</div>

<script>
    // Navigation Logic
    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Loading Animation
    let v = 0;
    const interval = setInterval(() => {
        v += 10;
        document.getElementById('prog').value = v;
        if(v >= 100) { clearInterval(interval); show('main'); }
    }, 300);

    // Simulation Logic
    function runAttack() {
        const t = document.getElementById('term');
        t.innerHTML += "<br>> Scanning... [SQL_INJECTION: DETECTED]";
    }
</script>
</body>
</html>
