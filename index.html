<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰拳課堂預約</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans pb-20">

    <!-- Header -->
    <header class="bg-black text-white p-4 sticky top-0 z-10 shadow-lg">
        <h1 class="text-xl font-bold">🥊 本週課表</h1>
    </header>

    <!-- Date Tabs -->
    <div class="flex overflow-x-auto p-4 gap-2 bg-white shadow-sm">
        <button class="px-4 py-2 bg-red-600 text-white rounded-full text-sm whitespace-nowrap">今日 05/30</button>
        <button class="px-4 py-2 bg-gray-200 rounded-full text-sm whitespace-nowrap">明天 05/31</button>
        <button class="px-4 py-2 bg-gray-200 rounded-full text-sm whitespace-nowrap">06/01</button>
    </div>

    <!-- Class List -->
    <main class="p-4 space-y-4">
        <!-- 課程卡片 1 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-600">
            <div class="flex justify-between items-start">
                <div>
                    <h2 class="text-lg font-bold">泰拳基礎入門</h2>
                    <p class="text-gray-500 text-sm flex items-center gap-1 mt-1">
                        <i data-lucide="clock" class="w-4 h-4"></i> 19:00 - 20:30
                    </p>
                    <p class="text-gray-500 text-sm flex items-center gap-1">
                        <i data-lucide="user" class="w-4 h-4"></i> 教練: 傑森 (Jason)
                    </p>
                </div>
                <div class="text-right">
                    <span class="text-red-600 font-bold block text-sm">剩餘 3 位</span>
                </div>
            </div>
            <button class="w-full mt-4 bg-black text-white py-2 rounded-lg font-semibold active:bg-gray-800 transition">
                立即預約
            </button>
        </div>

        <!-- 課程卡片 2 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-gray-400">
            <div class="flex justify-between items-start">
                <div>
                    <h2 class="text-lg font-bold text-gray-400">進階對打實戰</h2>
                    <p class="text-gray-400 text-sm flex items-center gap-1 mt-1">
                        <i data-lucide="clock" class="w-4 h-4"></i> 20:45 - 22:00
                    </p>
                </div>
                <span class="text-gray-400 text-sm">已額滿</span>
            </div>
            <button disabled class="w-full mt-4 bg-gray-200 text-gray-400 py-2 rounded-lg cursor-not-allowed">
                候補名單
            </button>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3">
        <button class="text-red-600 flex flex-col items-center"><i data-lucide="calendar"></i><span class="text-xs">課表</span></button>
        <button class="text-gray-500 flex flex-col items-center"><i data-lucide="list"></i><span class="text-xs">我的預約</span></button>
        <button class="text-gray-500 flex flex-col items-center"><i data-lucide="user"></i><span class="text-xs">會員</span></button>
    </nav>

    <script>
        // 初始化 Lucide 圖示
        lucide.createIcons();
    </script>
</body>
</html>
